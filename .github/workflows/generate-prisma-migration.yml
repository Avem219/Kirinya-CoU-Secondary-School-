name: Generate Initial Prisma Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate initial migration
        run: |
          mkdir -p prisma/migrations/0_init

          npx prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script > prisma/migrations/0_init/migration.sql

      - name: Create migration lock file
        run: |
          cat > prisma/migrations/migration_lock.toml <<'EOF'
          # Please do not edit this file manually
          # It should be added to your version control system (i.e. Git)
          provider = "postgresql"
          EOF

      - name: Commit migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prisma/migrations

          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi

          git commit -m "chore: add initial Prisma migration"
          git push
