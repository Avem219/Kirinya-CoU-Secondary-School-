
name: Import verified project ZIP

on:
  push:
    paths:
      - "kirinya-couss-production-507f1d8.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract verified project
        run: |
          unzip -o kirinya-couss-production-507f1d8.zip

      - name: Remove temporary import files
        run: |
          rm -f kirinya-couss-production-507f1d8.zip
          rm -f .github/workflows/import-project.yml

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: import verified Kirinya C.O.U.S.S platform"
          git pushz
